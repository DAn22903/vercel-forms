<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso de RR. HH. | Talento+</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/admin-login.js" defer></script>
</head>
<body class="login-page">
  <main class="login-card">
    <a class="brand" href="/">Talento<span>+</span></a>
    <p class="eyebrow">Panel privado</p>
    <h1>Acceso de RR. HH.</h1>
    <p>Inicia sesión para consultar las solicitudes recibidas.</p>
    <div id="login-message" class="notice notice-error" role="alert" hidden></div>
    <form id="login-form">
      <label class="field">Usuario<input name="username" autocomplete="username" required></label>
      <label class="field">Contraseña<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="button button-primary button-full" type="submit">Iniciar sesión</button>
    </form>
    <a class="back-link" href="/">← Volver al formulario</a>
  </main>
</body>
</html>
